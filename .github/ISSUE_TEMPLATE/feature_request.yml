name: 功能建议 / Feature request
description: 提一个新功能或改进 / Suggest a feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / What problem does it solve
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你希望怎么做 / What you'd like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案 / Alternatives considered
