# main 有新提交时，通知你自己的下游仓库（例如放个人配置的私有副本）立刻同步。
# 可选功能：没有配置 DOWNSTREAM_REPO 和 DOWNSTREAM_TOKEN 两个 Secrets 时整步跳过，fork 不受影响。
# 下游仓库的同步工作流需要监听 repository_dispatch，类型 flarepanel-updated。
name: 通知下游同步

on:
  push:
    branches: [main]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 发送 repository_dispatch
        env:
          DOWNSTREAM_REPO: ${{ secrets.DOWNSTREAM_REPO }}
          DOWNSTREAM_TOKEN: ${{ secrets.DOWNSTREAM_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$DOWNSTREAM_REPO" ] || [ -z "$DOWNSTREAM_TOKEN" ]; then
            echo "没有配置下游仓库，跳过"
            exit 0
          fi
          code=$(curl -sS -o /tmp/resp -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $DOWNSTREAM_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$DOWNSTREAM_REPO/dispatches" \
            -d "{\"event_type\":\"flarepanel-updated\",\"client_payload\":{\"sha\":\"$SHA\"}}")
          if [ "$code" != "204" ]; then
            echo "::error::通知下游失败（HTTP $code）"
            cat /tmp/resp
            exit 1
          fi
          echo "已通知下游同步"
